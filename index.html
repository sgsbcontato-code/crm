<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Local — Gestão de Leads</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230F3A2D'/><path d='M9 21V11h3l4 6 4-6h3v10h-3v-5l-4 5-4-5v5z' fill='%233FA986'/></svg>">
</head>
<body>

  <!-- ==================== BARRA SUPERIOR ==================== -->
  <header class="topo">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9"></path><path d="M12 3v9l6 4"></path>
        </svg>
      </span>
      <div class="marca-texto">
        <strong>CRM Local</strong>
        <span>Funil de vendas · dados salvos no seu computador</span>
      </div>
    </div>

    <div class="topo-acoes">
      <button type="button" class="btn btn-fantasma-claro" id="btn-importar-csv" title="Traz contatos de uma planilha .csv">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 21h16"/></svg>
        Importar
      </button>
      <input type="file" id="input-csv" accept=".csv,text/csv" hidden>
      <button type="button" class="btn btn-fantasma-claro" id="btn-exportar-csv" title="Exporta os leads visíveis no filtro atual">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/></svg>
        Exportar CSV
      </button>
      <button type="button" class="btn btn-fantasma-claro" id="btn-etapas" title="Renomear, reordenar, criar ou remover etapas e definir os prazos">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="14" rx="1.5"/></svg>
        Etapas
      </button>
      <button type="button" class="btn btn-fantasma-claro" id="btn-modelos" title="Edita as mensagens que abrem no WhatsApp">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Mensagens
      </button>
      <button type="button" class="pill-nuvem" id="pill-nuvem" hidden title="Sincronização"></button>
      <button type="button" class="btn btn-fantasma-claro" id="btn-seguranca" title="Senha e proteção dos dados">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span id="rotulo-seguranca">Senha</span>
      </button>
      <button type="button" class="btn btn-fantasma-claro" id="btn-backup" title="Backup dos dados">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11H4z"/><path d="M8 4v5h7"/><path d="M8 20v-6h8v6"/></svg>
        Backup
        <span class="selo-alerta" id="selo-backup" hidden>!</span>
      </button>
      <input type="file" id="input-importar" accept="application/json,.json" hidden>
      <button type="button" class="btn btn-primario" id="btn-novo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Novo lead
      </button>
    </div>
  </header>

  <main class="conteudo">

    <!-- ==================== INDICADORES ==================== -->
    <section class="kpis" aria-label="Indicadores">
      <article class="kpi kpi-total">
        <span class="kpi-icone">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <div>
          <span class="kpi-rotulo">Total de leads</span>
          <strong class="kpi-valor" id="kpi-total">0</strong>
          <span class="kpi-nota" id="kpi-total-nota">&nbsp;</span>
        </div>
      </article>

      <article class="kpi kpi-ganho" id="kpi-card-hoje" title="Leads no dia de falar — clique para filtrar">
        <span class="kpi-icone">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        </span>
        <div>
          <span class="kpi-rotulo">Falar hoje</span>
          <strong class="kpi-valor" id="kpi-hoje">0</strong>
          <span class="kpi-nota" id="kpi-hoje-nota">&nbsp;</span>
        </div>
      </article>

      <article class="kpi kpi-perdido" id="kpi-card-atrasados" title="Leads que passaram do prazo ideal da etapa — clique para filtrar">
        <span class="kpi-icone">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </span>
        <div>
          <span class="kpi-rotulo">Fora do prazo</span>
          <strong class="kpi-valor" id="kpi-atrasados">0</strong>
          <span class="kpi-nota" id="kpi-atrasados-nota">&nbsp;</span>
        </div>
      </article>
    </section>

    <!-- ==================== PAINEL PRINCIPAL ==================== -->
    <section class="painel">
      <div class="painel-topo">
        <nav class="abas" role="tablist" aria-label="Visualizações">
          <button type="button" class="aba ativa" data-aba="kanban" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="14" rx="1.5"/></svg>
            Kanban
          </button>
          <button type="button" class="aba" data-aba="hoje" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            Hoje
            <span class="aba-selo" id="selo-hoje" hidden>0</span>
          </button>
          <button type="button" class="aba" data-aba="tabela" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
            Tabela
          </button>
        </nav>

        <!-- Filtros combináveis (todos aplicados em conjunto, com E lógico) -->
        <div class="filtros">
          <div class="campo-busca">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="busca" placeholder="Buscar por nome, empresa, cidade, e-mail…" autocomplete="off">
          </div>
          <select id="filtro-etapa" class="select-filtro" aria-label="Filtrar por etapa do funil"></select>
          <select id="filtro-empresa" class="select-filtro" aria-label="Filtrar por empresa ou origem"></select>
          <select id="filtro-uf" class="select-filtro" aria-label="Filtrar por UF"></select>
          <select id="filtro-cidade" class="select-filtro" aria-label="Filtrar por cidade"></select>
          <button type="button" class="btn btn-fantasma btn-alternavel" id="btn-filtro-atrasados"
                  aria-pressed="false" title="Mostrar só quem passou do prazo ideal da etapa">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            Fora do prazo
          </button>
          <button type="button" class="btn btn-fantasma" id="btn-limpar-filtros">Limpar</button>
        </div>
      </div>

      <div class="barra-resultado">
        <span id="contador-resultados">0 leads</span>
        <span class="dica" id="dica-view">Clique em uma célula para editar direto na tabela.</span>
      </div>

      <div id="view-kanban" class="view ativa"></div>
      <div id="view-hoje" class="view"></div>
      <div id="view-tabela" class="view"></div>
    </section>

    <footer class="rodape">
      CRM Local · 100% offline — nenhum dado sai deste computador.
      <button type="button" class="link-perigo" id="btn-apagar-tudo">Apagar todos os dados</button>
    </footer>
  </main>

  <!-- ==================== MODAL ==================== -->
  <div class="modal-fundo" id="modal-fundo" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- Scripts sem módulos ES: assim o app funciona abrindo o index.html direto (file://) -->
  <script src="js/cidades.js"></script>
  <script src="js/cofre.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/importar.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/hoje.js"></script>
  <script src="js/tabela.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/nuvem-ui.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
